version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: smartcare_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: smartcare_password_2025
      POSTGRES_DB: smartcare_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartcare_backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:smartcare_password_2025@postgres:5432/smartcare_db?schema=public
      JWT_SECRET: smartcare-flow-hypersecure-jwt-secret-key-2025
      CORS_ORIGIN: "http://localhost:3000"
      NODE_ENV: production
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartcare_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:5000"
      NEXT_PUBLIC_SOCKET_URL: "http://localhost:5000"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata: